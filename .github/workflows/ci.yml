name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

# `github.workflow` is the *calling* workflow's name — "CI" on a direct push,
# "Release" when release.yml calls this one. Keying on it is what keeps a push
# to main from cancelling the very run the release gate is waiting on: both
# fire on the same commit and the same ref, so any group they share makes one
# cancel the other, and the survivor reports "cancelled" as a failure.
#
# `github.event_name` cannot do this job: a called workflow inherits the
# caller's event, so it reads "push" in both cases.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck:all

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: HEAD
          extra_args: --only-verified

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [build, security]
    if: always()
    steps:
      # Reports the actual result, not just "failed": a cancelled job means
      # something cancelled this run, which is a very different bug from a test
      # going red, and saying "checks failed" for it sends whoever reads this
      # straight to the wrong place.
      - name: Check status
        run: |
          status=0
          for job in build:${{ needs.build.result }} security:${{ needs.security.result }}; do
            name=${job%%:*}
            result=${job#*:}
            case "$result" in
              success)   echo "✅ ${name}: passed." ;;
              cancelled) echo "::error::${name} was cancelled — another run superseded this one."; status=1 ;;
              skipped)   echo "::error::${name} never ran."; status=1 ;;
              *)         echo "::error::${name} checks failed (${result})."; status=1 ;;
            esac
          done
          exit $status
