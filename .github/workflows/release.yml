name: Release

on:
  push:
    branches: [main]
    # Only package.json: it holds the version, so a release is exactly "the
    # version number changed". Watching CHANGELOG.md too would fire the whole
    # gate every time the Unreleased section is edited, which is most pushes.
    paths:
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a release in flight: a run killed between `git push origin <tag>`
# and the npm publish leaves a tag with no package behind it, and the next run
# sees the tag and decides there is nothing to do.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.check_tag.outputs.tag_exists == 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"

      # package.json also changes when a script or a dependency is edited, so
      # the path filter alone is not "the version went up". The tag is the real
      # record of what shipped: if it exists, this push changed something else.
      - name: Check whether this version was already released
        id: check_tag
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "⚠️  Tag ${{ steps.version.outputs.tag }} already exists — nothing to release."
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Tag ${{ steps.version.outputs.tag }} is new."
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # A release whose notes would be empty is a mistake, not a release: the
      # CHANGELOG section is the release notes.
      - name: Require a CHANGELOG entry for this version
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          if ! grep -q "^## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${{ steps.version.outputs.version }}]' section. Rename '## [Unreleased]' to '## [${{ steps.version.outputs.version }}] - $(date +%F)' before releasing."
            exit 1
          fi
          echo "✅ CHANGELOG entry found."

  # The same jobs a push to main runs, on this exact commit. Reused rather than
  # copied, so the release gate cannot drift from CI.
  ci:
    name: CI
    needs: verify
    if: needs.verify.outputs.should_release == 'true'
    uses: ./.github/workflows/ci.yml

  # Only runs once `ci` has succeeded on this commit — nothing is tagged or
  # published before the gate is green.
  publish:
    name: Build, Tag, Release and Publish
    needs: [verify, ci]
    if: needs.verify.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CI already ran every check; this build only produces the artifacts the
      # release attaches and the tarball npm publishes.
      - name: Build
        run: pnpm build

      - name: Package release assets
        run: |
          TAG=${{ needs.verify.outputs.tag }}
          mkdir -p release
          tar -czf "release/orbinum-sdk-${TAG}.tar.gz" dist/
          (cd release && sha256sum ./*.tar.gz > "checksums-${TAG}.txt")
          ls -lh release/
          cat "release/checksums-${TAG}.txt"

      - name: Create release notes
        run: |
          # The section for the version being released, by exact heading —
          # matching "the first ## [" instead would pick up [Unreleased] and
          # ship unreleased work as the release notes.
          awk -v tag="## [${{ needs.verify.outputs.version }}]" '
            index($0, tag) == 1  { flag = 1; next }
            flag && /^## \[/     { exit }
            flag && /^\[[^]]+\]:/{ exit }   # link definitions end the section
            flag
          ' CHANGELOG.md > release_notes_body.md

          {
            echo "## ${{ needs.verify.outputs.tag }}"
            echo ""
            if [ -s release_notes_body.md ]; then
              cat release_notes_body.md
            else
              echo "- Release generated from CI."
            fi
            echo ""
            echo "## Install"
            echo ""
            echo '```sh'
            echo "pnpm add @orbinum/protocol@${{ needs.verify.outputs.version }}"
            echo '```'
            echo ""
            echo "## Release Assets"
            echo ""
            echo "- \`orbinum-sdk-${{ needs.verify.outputs.tag }}.tar.gz\` — compiled dist (ESM + CJS + types)"
            echo "- \`checksums-${{ needs.verify.outputs.tag }}.txt\` — SHA-256 checksums"
          } > release_notes.md

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.verify.outputs.tag }}" -m "Release ${{ needs.verify.outputs.tag }}"
          git push origin "${{ needs.verify.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: Release ${{ needs.verify.outputs.tag }}
          files: |
            release/*.tar.gz
            release/*.txt
          body_path: release_notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Last, and only here: a failed publish leaves a tag and a GitHub release
      # that can be retried, whereas a published version can never be replaced.
      #
      # The token is written into .npmrc rather than passed as NODE_AUTH_TOKEN.
      # That variable is a convention of `actions/setup-node`, which writes
      # `_authToken=${NODE_AUTH_TOKEN}` into .npmrc and relies on **npm**
      # expanding it at run time. pnpm does not do that expansion — it reads the
      # literal string and reports ENEEDAUTH, having never seen a token at all.
      - name: Publish to npm
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          pnpm publish --no-git-checks --access public
          echo "✅ Published @orbinum/protocol@${{ needs.verify.outputs.version }} to npm"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
